server {
    listen 80;
    server_name _; # Zamień na swoją domenę lub adres IP, np. inventaryzator.local

    # Ścieżka do katalogu z aplikacją
    root /var/www/inventaryzator;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 25M;

    # Główne przekierowanie zapytań (obsługa routingu MVC)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Obsługa skryptów PHP przez PHP-FPM
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        
        # Wskaż socket PHP-FPM odpowiedni dla Twojej wersji:
        # Ubuntu 22.04 LTS domyślnie: php8.1-fpm.sock
        # Ubuntu 24.04 LTS domyślnie: php8.3-fpm.sock
        # Debian 12 domyślnie: php8.2-fpm.sock
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # =========================================================================
    # BEZPIECZEŃSTWO: Blokada bezpośredniego pobierania bazy danych i plików kodu
    # =========================================================================
    location ~ ^/(data|inc|sql|app|\.git) {
        deny all;
        return 404;
    }

    location ~* \.(sqlite|sqlite3|db|sql|log|env|htaccess)$ {
        deny all;
        return 404;
    }

    # Statyczne zasoby
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Logi
    error_log /var/log/nginx/inventaryzator_error.log;
    access_log /var/log/nginx/inventaryzator_access.log;
}

